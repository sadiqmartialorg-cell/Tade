name: WorkLog reminders

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      id-token: write
    steps:
      - name: Generate due check and task reminders
        run: |
          set -euo pipefail
          oidc_token=$(curl --fail-with-body --silent --show-error --max-time 20 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=worklog-reminders" | jq -r '.value')
          test -n "$oidc_token"
          curl --fail-with-body --silent --show-error --retry 2 --max-time 60 \
            -X POST 'https://edlpujkyxjcubvjdcmle.supabase.co/functions/v1/worklog-operations' \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $oidc_token" \
            -d '{"action":"tick"}'
